plugins {
    id 'com.android.application'
}

android {
    namespace 'com.akdelivery.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.akdelivery.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    sourceSets {
        main.res.srcDir("$buildDir/generated/launcher-res")
    }
}

def generateLauncherIcon = tasks.register("generateLauncherIcon") {
    def outputFile = file("$buildDir/generated/launcher-res/mipmap-nodpi/ic_launcher.webp")
    outputs.file(outputFile)
    doLast {
        outputFile.parentFile.mkdirs()
        outputFile.bytes = file("../launcher-icon.webp.b64").text.trim().decodeBase64()
    }
}

tasks.named("preBuild").configure {
    dependsOn(generateLauncherIcon)
}
